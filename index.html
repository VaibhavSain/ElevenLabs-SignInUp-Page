<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIEleven Labs</title>
  </head>
  <body>
    <header>
      <p class="heading">IIElevenLabs</p>
    </header>
    <main>
      <div class="container">
        <h2>Create an account</h2>
        <img class="icon" src="icon.png" alt="google-icon" />
        <button class="signup-btn2">Sign up with Google</button>
        <span></span>
        <label class="email-label" for="email">Email</label>
        <input id="email" name="email" type="email" />
        <label class="password-label" for="password">Password</label>
        <input id="password" name="password" type="password" />
        <button class="signup-btn">Sign up</button>
        <p>Already registered? <u>Sign in</u></p>
      </div>
    </main>
    <footer>
      <p>
        By continuing, you agree to our <u>Terms of Service</u> and
        <u>Privacy Policy.</u>
      </p>
    </footer>
  </body>
</html>
